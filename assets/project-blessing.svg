<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="blessBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a1f"/>
      <stop offset="50%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="350" rx="16" fill="url(#blessBg)"/>

  <!-- Geometric Islamic Star / Pattern Accent -->
  <g opacity="0.12" stroke="#10b981" stroke-width="1.2" fill="none" transform="translate(450, 100)">
    <rect x="-60" y="-60" width="120" height="120" rx="4"/>
    <rect x="-60" y="-60" width="120" height="120" rx="4" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="50"/>
  </g>

  <!-- Crescent Moon & Star -->
  <g transform="translate(480, 70)">
    <path d="M0,0 A 28 28 0 1 0 38 42 A 22 22 0 1 1 0 0 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <polygon points="45,10 48,18 56,18 50,23 52,31 45,26 38,31 40,23 34,18 42,18" fill="url(#goldGrad)" transform="scale(0.5) translate(30,-5)"/>
  </g>

  <!-- Left Side: App Card Interface -->
  <g transform="translate(45, 30)">
    <rect width="320" height="290" rx="14" fill="#0d1822" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect width="320" height="60" rx="14" fill="#12232f"/>
    <text x="24" y="36" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Blessing Tracker</text>
    <text x="24" y="50" fill="#6ee7b7" font-family="sans-serif" font-size="10">Daily Spiritual Companion</text>
    
    <!-- Next Prayer Card -->
    <rect x="20" y="75" width="280" height="75" rx="10" fill="url(#emeraldGrad)"/>
    <text x="36" y="102" fill="#ffffff" font-family="sans-serif" font-size="11" opacity="0.9">NEXT PRAYER</text>
    <text x="36" y="130" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Maghrib  18:24</text>
    <text x="210" y="125" fill="#e6fffa" font-family="sans-serif" font-size="12">in 42 mins</text>

    <!-- Dhikr Counter Widget -->
    <g transform="translate(20, 165)">
      <rect width="132" height="100" rx="8" fill="#132431" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10">DIGITAL TASBIH</text>
      <text x="14" y="58" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="bold">33 / 99</text>
      <rect x="14" y="75" width="104" height="6" rx="3" fill="#1e3444"/>
      <rect x="14" y="75" width="35" height="6" rx="3" fill="#06b6d4"/>
    </g>

    <!-- Qibla Direction Widget -->
    <g transform="translate(168, 165)">
      <rect width="132" height="100" rx="8" fill="#132431" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10">QIBLA COMPASS</text>
      <!-- Mini compass circle -->
      <circle cx="66" cy="60" r="22" fill="none" stroke="#2a455a" stroke-width="2"/>
      <line x1="66" y1="60" x2="78" y2="45" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <circle cx="66" cy="60" r="3" fill="#ffffff"/>
      <text x="50" y="93" fill="#e2e8f0" font-family="sans-serif" font-size="9">294° NW</text>
    </g>
  </g>

  <!-- Right Side: Details & Feature Pills -->
  <g transform="translate(390, 140)">
    <rect width="80" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="15" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">LIFESTYLE</text>

    <text x="0" y="50" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Daily Habit Builder</text>
    <text x="0" y="74" fill="#94a3b8" font-family="sans-serif" font-size="11">Prayer times, Quran milestones, and Dhikr</text>

    <g transform="translate(0, 100)">
      <rect width="55" height="22" rx="6" fill="#11222d"/>
      <text x="10" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="10">Flutter</text>
      <rect x="62" y="0" width="55" height="22" rx="6" fill="#11222d"/>
      <text x="74" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="10">SQLite</text>
      <rect x="124" y="0" width="60" height="22" rx="6" fill="#11222d"/>
      <text x="133" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="10">GPS API</text>
    </g>
  </g>
</svg>

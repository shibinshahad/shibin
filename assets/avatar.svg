<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2438" />
      <stop offset="100%" stop-color="#111524" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0ac69" />
      <stop offset="100%" stop-color="#c68642" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2438" />
      <stop offset="100%" stop-color="#12101a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with neon border -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="4" filter="url(#glow)" opacity="0.8" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="2" />

  <!-- Background Tech Grid Lines & Particles -->
  <g opacity="0.15" stroke="#8b5cf6" stroke-width="1">
    <line x1="50" y1="100" x2="350" y2="100" />
    <line x1="50" y1="200" x2="350" y2="200" />
    <line x1="50" y1="300" x2="350" y2="300" />
    <line x1="100" y1="50" x2="100" y2="350" />
    <line x1="200" y1="50" x2="200" y2="350" />
    <line x1="300" y1="50" x2="300" y2="350" />
  </g>

  <!-- Glowing Code / Tech Symbol Accents -->
  <text x="70" y="140" fill="#a855f7" font-family="'Courier New', monospace" font-size="18" font-weight="bold" opacity="0.7">&lt;/&gt;</text>
  <text x="310" y="140" fill="#38bdf8" font-family="'Courier New', monospace" font-size="18" font-weight="bold" opacity="0.7">{ data }</text>
  <text x="65" y="270" fill="#6366f1" font-family="'Courier New', monospace" font-size="16" font-weight="bold" opacity="0.6">AI.py</text>
  <text x="305" y="270" fill="#a855f7" font-family="'Courier New', monospace" font-size="16" font-weight="bold" opacity="0.6">f(x)</text>

  <!-- Body / Hoodie -->
  <path d="M100 370 C100 290 140 270 200 270 C260 270 300 290 300 370 Z" fill="url(#hoodieGrad)" />
  <path d="M150 275 L200 330 L250 275 Z" fill="#171b2d" opacity="0.9" />
  <!-- Inner shirt neon collar line -->
  <path d="M175 272 Q200 295 225 272" fill="none" stroke="url(#ringGrad)" stroke-width="3" />

  <!-- Neck -->
  <rect x="180" y="230" width="40" height="45" rx="10" fill="url(#skinGrad)" />

  <!-- Head / Face -->
  <path d="M140 170 C140 120 160 100 200 100 C240 100 260 120 260 170 C260 225 235 245 200 245 C165 245 140 225 140 170 Z" fill="url(#skinGrad)" />

  <!-- Ears -->
  <circle cx="138" cy="180" r="14" fill="#c68642" />
  <circle cx="262" cy="180" r="14" fill="#c68642" />

  <!-- Hair -->
  <path d="M135 160 C130 115 155 75 200 75 C245 75 270 115 265 160 C255 125 240 105 200 105 C160 105 145 125 135 160 Z" fill="url(#hairGrad)" />
  <path d="M145 105 C175 80 230 80 255 105 C240 92 165 92 145 105 Z" fill="#3b324f" />

  <!-- Glasses Frames (Modern stylish developer glasses) -->
  <g stroke="#38bdf8" stroke-width="4" fill="rgba(56, 189, 248, 0.08)">
    <rect x="150" y="160" width="38" height="26" rx="8" />
    <rect x="212" y="160" width="38" height="26" rx="8" />
    <line x1="188" y1="172" x2="212" y2="172" stroke-width="3" />
    <!-- Temple legs -->
    <line x1="150" y1="170" x2="135" y2="168" stroke-width="3" />
    <line x1="250" y1="170" x2="265" y2="168" stroke-width="3" />
  </g>

  <!-- Eyes behind glasses -->
  <circle cx="169" cy="173" r="4.5" fill="#1f2438" />
  <circle cx="171" cy="171" r="1.5" fill="#ffffff" />
  <circle cx="231" cy="173" r="4.5" fill="#1f2438" />
  <circle cx="233" cy="171" r="1.5" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M152 150 Q168 145 184 150" fill="none" stroke="#221b2d" stroke-width="3.5" stroke-linecap="round" />
  <path d="M216 150 Q232 145 248 150" fill="none" stroke="#221b2d" stroke-width="3.5" stroke-linecap="round" />

  <!-- Nose & Smile -->
  <path d="M198 185 Q200 196 205 196" fill="none" stroke="#b07233" stroke-width="2.5" stroke-linecap="round" />
  <path d="M185 212 Q200 223 215 212" fill="none" stroke="#874619" stroke-width="3" stroke-linecap="round" />
  
  <!-- Subtle beard shadow / style -->
  <path d="M180 230 Q200 238 220 230" fill="none" stroke="#221b2d" stroke-width="2" stroke-dasharray="2,2" opacity="0.5" />

  <!-- Glowing Status Badge "Online / Ready" -->
  <g transform="translate(270, 275)">
    <circle cx="15" cy="15" r="14" fill="#090a10" stroke="#10b981" stroke-width="3" />
    <circle cx="15" cy="15" r="6" fill="#10b981" />
  </g>
</svg>

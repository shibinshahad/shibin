<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="autoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emergencyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d33"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
  </defs>

  <rect width="600" height="350" rx="16" fill="url(#autoBg)"/>

  <!-- Background Radar / Map Grid Circles -->
  <g stroke="rgba(14, 165, 233, 0.15)" stroke-width="1.5" fill="none">
    <circle cx="430" cy="175" r="50"/>
    <circle cx="430" cy="175" r="90" stroke-dasharray="4,4"/>
    <circle cx="430" cy="175" r="130"/>
    <!-- Radar sweep effect line -->
    <line x1="430" y1="175" x2="520" y2="85" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Left Side: Mobile Phone Device Mockup -->
  <g transform="translate(60, 25)">
    <!-- Phone Body -->
    <rect width="170" height="300" rx="24" fill="#06080e" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
    <!-- Screen -->
    <rect x="7" y="7" width="156" height="286" rx="18" fill="url(#phoneGrad)"/>
    <!-- Dynamic Island / Notch -->
    <rect x="62" y="14" width="46" height="10" rx="5" fill="#000000"/>
    
    <!-- App Header -->
    <text x="20" y="44" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">AutoResq SOS</text>
    <circle cx="140" cy="40" r="4" fill="#10b981"/>

    <!-- Map placeholder on screen -->
    <rect x="15" y="55" width="140" height="110" rx="8" fill="#11192e"/>
    <!-- Road lines -->
    <path d="M25 140 L70 90 L120 110 L145 65" fill="none" stroke="#253556" stroke-width="6"/>
    <!-- User location pin -->
    <circle cx="70" cy="90" r="7" fill="#f43f5e"/>
    <circle cx="70" cy="90" r="3" fill="#ffffff"/>
    <!-- Mechanic pin -->
    <circle cx="120" cy="110" r="6" fill="#38bdf8"/>
    <circle cx="120" cy="110" r="2" fill="#ffffff"/>

    <!-- Dispatch Card -->
    <rect x="15" y="175" width="140" height="65" rx="8" fill="#18233c" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    <text x="25" y="195" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">Mechanic En Route</text>
    <text x="25" y="210" fill="#94a3b8" font-family="sans-serif" font-size="8">ETA: 8 mins | Mike R.</text>
    <rect x="25" y="222" width="70" height="8" rx="2" fill="#0ea5e9"/>

    <!-- SOS Button -->
    <rect x="15" y="250" width="140" height="28" rx="14" fill="url(#emergencyGrad)"/>
    <text x="50" y="268" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">REQUEST AID</text>
  </g>

  <!-- Right Side: Feature Highlights & HUD -->
  <g transform="translate(270, 60)">
    <!-- Badge -->
    <rect width="90" height="22" rx="11" fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9" stroke-width="1"/>
    <text x="12" y="15" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">FLUTTER APP</text>

    <text x="0" y="55" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">AutoResq Dispatch</text>
    <text x="0" y="78" fill="#94a3b8" font-family="sans-serif" font-size="12">Instant On-Demand Roadside Assistance</text>

    <!-- Mini stats boxes -->
    <g transform="translate(0, 100)">
      <rect width="130" height="65" rx="8" fill="#101728" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="14" y="26" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">&lt; 10 Mins</text>
      <text x="14" y="46" fill="#94a3b8" font-family="sans-serif" font-size="10">Average Response</text>

      <rect x="145" y="0" width="130" height="65" rx="8" fill="#101728" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="159" y="26" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold">GPS Live</text>
      <text x="159" y="46" fill="#94a3b8" font-family="sans-serif" font-size="10">Realtime Geo-Tracking</text>
    </g>

    <!-- Tech pills -->
    <g transform="translate(0, 185)">
      <rect width="60" height="20" rx="10" fill="#15213b"/>
      <text x="12" y="14" fill="#cbd5e1" font-family="sans-serif" font-size="9">Flutter</text>

      <rect x="68" y="0" width="60" height="20" rx="10" fill="#15213b"/>
      <text x="78" y="14" fill="#cbd5e1" font-family="sans-serif" font-size="9">Firebase</text>

      <rect x="136" y="0" width="70" height="20" rx="10" fill="#15213b"/>
      <text x="146" y="14" fill="#cbd5e1" font-family="sans-serif" font-size="9">Maps API</text>
    </g>
  </g>
</svg>
